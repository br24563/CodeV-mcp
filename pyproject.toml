[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codev-mcp"
version = "0.1.0"
description = "Experimental MCP server for driving CODE V from a coding agent over its COM API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
codev-mcp = "codev_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codev_mcp"]
